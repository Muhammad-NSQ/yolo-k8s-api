apiVersion: v1
kind: ConfigMap
metadata:
  name: model-converter-config
  namespace: inference  # Changed to inference namespace
data:
  MODEL: "yolov8l.pt" 
  MODEL_NAME: "yolov8trt_fp16" 
  MIN_SHAPE: "1x3x640x640"
  OPT_SHAPE: "4x3x640x640"
  MAX_SHAPE: "8x3x640x640"
  DEVICE: "0"
  FORCE_REBUILD: "false"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: model-config
  namespace: inference
data:
  MODEL_DEVICE: "cuda:0"
  MODEL_NAME: "yolov8trt_fp16" 
  MODEL_USE_TENSORRT: "true"  
  MODEL_USE_TRITON: "true"
  MODEL_TRITON_URL: "triton-service:8001"
  MODEL_TRITON_MODEL_NAME: "yolov8trt_fp16"  
  MODEL_CONFIDENCE_THRESHOLD: "0.25"
  MODEL_IOU_THRESHOLD: "0.45"
  MODEL_MAX_DETECTIONS: "100"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: inference
data:
  API_DEBUG: "true"
  LOG_LEVEL: "INFO"
  API_MAX_IMAGE_SIZE: "10485760"
  API_MAX_VIDEO_SIZE: "104857600"
  API_UPLOAD_DIR: "/tmp/uploads"
  API_RESULTS_DIR: "/tmp/uploads/results"