apiVersion: v1
kind: Service
metadata:
  name: triton-service
  namespace: inference
spec:
  selector:
    app: triton-server
  ports:
  - name: http
    port: 8000
    targetPort: 8000
  - name: grpc
    port: 8001
    targetPort: 8001
  - name: metrics
    port: 8002
    targetPort: 8002
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: yolo-api-service
  namespace: inference
spec:
  selector:
    app: yolo-api
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP